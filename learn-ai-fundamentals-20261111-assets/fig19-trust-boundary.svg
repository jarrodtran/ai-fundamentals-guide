<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 395" role="img" aria-label="Trust boundary for prompt injection" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Trust boundary for prompt injection</title><rect width="920" height="395" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker></defs><rect x="20" y="40" width="250" height="150" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="145" y="64" font-size="15" text-anchor="middle" fill="#111" font-weight="600">Trusted</text><text x="145" y="96" font-size="13" text-anchor="middle" fill="#111">Developer / system instructions</text><text x="145" y="122" font-size="13" text-anchor="middle" fill="#111">The user's own request</text><rect x="20" y="210" width="250" height="170" rx="8" fill="#fff" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="6 4"/><text x="145" y="234" font-size="15" text-anchor="middle" fill="#1f5fbf" font-weight="600">Untrusted</text><text x="145" y="262" font-size="13" text-anchor="middle" fill="#111">Web pages</text><text x="145" y="288" font-size="13" text-anchor="middle" fill="#111">Emails and documents</text><text x="145" y="314" font-size="13" text-anchor="middle" fill="#111">Tool results</text><text x="145" y="340" font-size="13" text-anchor="middle" fill="#111">MCP tool descriptions</text><rect x="340" y="120" width="220" height="180" rx="8" fill="#f2f2f2" stroke="#111"/><text x="450" y="146" font-size="14" text-anchor="middle" fill="#111" font-weight="600">Context window</text><text x="450" y="172" font-size="12" text-anchor="middle" fill="#555">all just tokens:</text><text x="450" y="190" font-size="12" text-anchor="middle" fill="#555">no hard wall between</text><text x="450" y="208" font-size="12" text-anchor="middle" fill="#555">instructions and data</text><rect x="390" y="230" width="120" height="50" rx="6" fill="#111"/><text x="450" y="260" font-size="14" text-anchor="middle" fill="#fff" font-weight="600">Model</text><line x1="270" y1="115" x2="338" y2="170" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><line x1="270" y1="295" x2="338" y2="250" stroke="#1f5fbf" stroke-width="1.5" marker-end="url(#b)"/><line x1="560" y1="255" x2="618" y2="255" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><rect x="620" y="225" width="110" height="60" rx="6" fill="#fff" stroke="#1f5fbf" stroke-width="2"/><text x="675" y="250" font-size="13" text-anchor="middle" fill="#1f5fbf" font-weight="600">Approval</text><text x="675" y="268" font-size="13" text-anchor="middle" fill="#1f5fbf" font-weight="600">gate</text><line x1="730" y1="255" x2="770" y2="255" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="772" y="200" width="130" height="110" rx="6" fill="#fff" stroke="#111"/><text x="837" y="224" font-size="13" text-anchor="middle" fill="#111" font-weight="600">Tools</text><text x="837" y="248" font-size="12" text-anchor="middle" fill="#111">send email</text><text x="837" y="268" font-size="12" text-anchor="middle" fill="#111">read files</text><text x="837" y="288" font-size="12" text-anchor="middle" fill="#111">buy, delete</text><text x="620" y="60" font-size="13" text-anchor="start" fill="#111" font-weight="600">Defenses (OWASP, OpenAI, MCP spec):</text><text x="620" y="84" font-size="12" text-anchor="start" fill="#111">• Least privilege for tools</text><text x="620" y="104" font-size="12" text-anchor="start" fill="#111">• Human approval for risky actions</text><text x="620" y="124" font-size="12" text-anchor="start" fill="#111">• Mark and separate untrusted content</text><text x="620" y="144" font-size="12" text-anchor="start" fill="#111">• Structured outputs between steps</text></svg>