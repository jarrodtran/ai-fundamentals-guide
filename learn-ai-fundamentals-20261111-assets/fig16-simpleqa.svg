<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 272" role="img" aria-label="SimpleQA abstention, accuracy, and error for two models" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>SimpleQA abstention, accuracy, and error for two models</title><rect width="900" height="272" fill="#fff"/><text x="20" y="22" font-size="13" text-anchor="start" fill="#555">SimpleQA, two specific OpenAI models, as published in OpenAI's hallucination post (from the GPT-5 system card)</text><text x="200" y="76" font-size="14" text-anchor="end" fill="#111" font-weight="600">gpt-5-thinking-mini</text><rect x="210" y="50" width="322.40000000000003" height="40" fill="#bbb"/><text x="371.20000000000005" y="75" font-size="13" text-anchor="middle" fill="#111" font-weight="600">52%</text><rect x="532.4000000000001" y="50" width="136.4" height="40" fill="#111"/><text x="600.6000000000001" y="75" font-size="13" text-anchor="middle" fill="#fff" font-weight="600">22%</text><rect x="668.8000000000001" y="50" width="161.20000000000002" height="40" fill="#1f5fbf"/><text x="749.4000000000001" y="75" font-size="13" text-anchor="middle" fill="#fff" font-weight="600">26%</text><text x="200" y="156" font-size="14" text-anchor="end" fill="#111" font-weight="600">OpenAI o4-mini</text><rect x="210" y="130" width="6.2" height="40" fill="#bbb"/><text x="213.1" y="124" font-size="12" text-anchor="middle" fill="#111">1%</text><rect x="216.2" y="130" width="148.79999999999998" height="40" fill="#111"/><text x="290.59999999999997" y="155" font-size="13" text-anchor="middle" fill="#fff" font-weight="600">24%</text><rect x="365.0" y="130" width="465.0" height="40" fill="#1f5fbf"/><text x="597.5" y="155" font-size="13" text-anchor="middle" fill="#fff" font-weight="600">75%</text><rect x="210" y="214" width="14" height="14" fill="#bbb"/><text x="230" y="226" font-size="13" text-anchor="start" fill="#111">Abstained</text><rect x="400" y="214" width="14" height="14" fill="#111"/><text x="420" y="226" font-size="13" text-anchor="start" fill="#111">Correct</text><rect x="590" y="214" width="14" height="14" fill="#1f5fbf"/><text x="610" y="226" font-size="13" text-anchor="start" fill="#111">Wrong (hallucinated)</text><text x="210" y="256" font-size="13" text-anchor="start" fill="#111" font-weight="600">Accuracy is almost the same (22% vs 24%). Wrong answers are not (26% vs 75%).</text></svg>