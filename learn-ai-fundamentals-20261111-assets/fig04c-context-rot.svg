<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" role="img" aria-label="Single fact lookup versus context rot" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Single fact lookup versus context rot</title><rect width="900" height="285" fill="#fff"/><text x="450" y="24" font-size="13" text-anchor="middle" fill="#555">Conceptual, not data: two kinds of long-context task</text><rect x="20" y="40" width="420" height="230" rx="8" fill="#fff" stroke="#1f5fbf" stroke-width="2"/><text x="230" y="68" font-size="15" text-anchor="middle" fill="#111" font-weight="600">Find one fact in a long context</text><rect x="50" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="80" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="110" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="140" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="170" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="200" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="230" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="260" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="290" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="320" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="350" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="380" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="260" y="90" width="24" height="40" fill="#1f5fbf"/><text x="272" y="148" font-size="12" text-anchor="middle" fill="#1f5fbf">the fact</text><text x="230" y="182" font-size="13" text-anchor="middle" fill="#111">Google: "highly capable of extracting that</text><text x="230" y="200" font-size="13" text-anchor="middle" fill="#111">information (up to 99% accuracy in many cases)"</text><text x="230" y="232" font-size="13" text-anchor="middle" fill="#555">Works well, even with very long inputs</text><rect x="460" y="40" width="420" height="230" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="670" y="68" font-size="15" text-anchor="middle" fill="#111" font-weight="600">Use many scattered facts at once</text><rect x="490" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="520" y="90" width="24" height="40" fill="#555"/><rect x="550" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="580" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="610" y="90" width="24" height="40" fill="#555"/><rect x="640" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="670" y="90" width="24" height="40" fill="#555"/><rect x="700" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="730" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="760" y="90" width="24" height="40" fill="#555"/><rect x="790" y="90" width="24" height="40" fill="#e6e6e6"/><rect x="820" y="90" width="24" height="40" fill="#555"/><text x="670" y="148" font-size="12" text-anchor="middle" fill="#555">many facts needed</text><text x="670" y="182" font-size="13" text-anchor="middle" fill="#111">Anthropic: "As token count grows, accuracy and</text><text x="670" y="200" font-size="13" text-anchor="middle" fill="#111">recall degrade" (context rot). Google: with multiple</text><text x="670" y="218" font-size="13" text-anchor="middle" fill="#111">"needles," it "does not perform with the same accuracy"</text><text x="670" y="250" font-size="13" text-anchor="middle" fill="#555">Gets worse as the context grows</text></svg>