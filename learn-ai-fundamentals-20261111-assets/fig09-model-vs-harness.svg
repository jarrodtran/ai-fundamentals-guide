<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 345" role="img" aria-label="Model versus harness" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Model versus harness</title><rect width="940" height="345" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker></defs><rect x="150" y="30" width="600" height="300" rx="14" fill="#f7f7f7" stroke="#111" stroke-dasharray="6 4"/><text x="450" y="52" text-anchor="middle" font-weight="600">The harness (the software around the model)</text><rect x="370" y="140" width="160" height="80" rx="8" fill="#111"/><text x="450" y="178" text-anchor="middle" fill="#fff" font-weight="600">Model</text><text x="450" y="198" text-anchor="middle" fill="#ccc" font-size="12">predicts tokens</text><rect x="160" y="80" width="170" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="245.0" y="108.0" text-anchor="middle" font-size="12"  fill="#111">System prompt</text><rect x="565" y="80" width="170" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="650.0" y="108.0" text-anchor="middle" font-size="12"  fill="#111">Tools: search, code, files</text><rect x="160" y="260" width="170" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="245.0" y="288.0" text-anchor="middle" font-size="12"  fill="#111">Memory and progress notes</text><rect x="565" y="260" width="170" height="46" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="650.0" y="288.0" text-anchor="middle" font-size="12"  fill="#111">Context management</text><line x1="330" y1="103" x2="370" y2="160" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><line x1="580" y1="103" x2="530" y2="160" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><line x1="330" y1="283" x2="370" y2="210" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><line x1="580" y1="283" x