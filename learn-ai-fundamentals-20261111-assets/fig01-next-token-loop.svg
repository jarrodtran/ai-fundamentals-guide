<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" role="img" aria-label="The next-token loop" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>The next-token loop</title><rect width="900" height="215" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker></defs><rect x="20" y="60" width="170" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="105.0" y="89.0" text-anchor="middle" font-size="14"  fill="#111">Your text so far</text><text x="105.0" y="108.0" text-anchor="middle" font-size="12" fill="#555">as tokens</text><line x1="190" y1="90" x2="250" y2="90" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="250" y="50" width="170" height="80" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="335.0" y="89.0" text-anchor="middle" font-size="14" font-weight="600" fill="#111">The model</text><text x="335.0" y="108.0" text-anchor="middle" font-size="12" fill="#555">one pass, all layers</text><line x1="420" y1="90" x2="480" y2="90" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="480" y="50" width="200" height="80" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="580.0" y="89.0" text-anchor="middle" font-size="14"  fill="#111">Odds for every</text><text x="580.0" y="108.0" text-anchor="middle" font-size="12" fill="#555">possible next token</text><line x1="680" y1="90" x2="740" y2="90" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="740" y="60" width="140" height="60" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="810.0" y="89.0" text-anchor="middle" font-size="14"  fill="#111">Pick one</text><text x="810.0" y="108.0" text-anchor="middle" font-size="12" fill="#555">(sampling)</text><path d="M810,120 C810,200 105,200 105,125" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="455" y="192" text-anchor="middle" font-size="12" fill="#555">add the new token to the text, then repeat until done</text></svg>