<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 222" role="img" aria-label="Timeline of a reasoning model request" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Timeline of a reasoning model request</title><rect width="920" height="222" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker></defs><text x="20" y="22" font-size="13" text-anchor="start" fill="#555">Example numbers only: one request to a reasoning model</text><rect x="60" y="60" width="40.0" height="40" fill="#ddd"/><rect x="100.0" y="60" width="440.0" height="40" fill="#999"/><text x="320.0" y="85" font-size="12" text-anchor="middle" fill="#fff">thinking tokens (hidden, billed as output)</text><rect x="540" y="60" width="240" height="40" fill="#1f5fbf"/><text x="660.0" y="85" font-size="12" text-anchor="middle" fill="#fff">answer tokens (visible)</text><line x1="60" y1="104" x2="60" y2="110" stroke="#111"/><text x="60" y="124" font-size="12" text-anchor="middle" fill="#111">0 s</text><line x1="140" y1="104" x2="140" y2="110" stroke="#111"/><text x="140" y="124" font-size="12" text-anchor="middle" fill="#111">1 s</text><line x1="220" y1="104" x2="220" y2="110" stroke="#111"/><text x="220" y="124" font-size="12" text-anchor="middle" fill="#111">2 s</text><line x1="300" y1="104" x2="300" y2="110" stroke="#111"/><text x="300" y="124" font-size="12" text-anchor="middle" fill="#111">3 s</text><line x1="380" y1="104" x2="380" y2="110" stroke="#111"/><text x="380" y="124" font-size="12" text-anchor="middle" fill="#111">4 s</text><line x1="460" y1="104" x2="460" y2="110" stroke="#111"/><text x="460" y="124" font-size="12" text-anchor="middle" fill="#111">5 s</text><line x1="540" y1="104" x2="540" y2="110" stroke="#111"/><text x="540" y="124" font-size="12" text-anchor="middle" fill="#111">6 s</text><line x1="620" y1="104" x2="620" y2="110" stroke="#111"/><text x="620" y="124" font-size="12" text-anchor="middle" fill="#111">7 s</text><line x1="700" y1="104" x2="700" y2="110" stroke="#111"/><text x="700" y="124" font-size="12" text-anchor="middle" fill="#111">8 s</text><line x1="780" y1="104" x2="780" y2="110" stroke="#111"/><text x="780" y="124" font-size="12" text-anchor="middle" fill="#111">9 s</text><line x1="860" y1="104" x2="860" y2="110" stroke="#111"/><text x="860" y="124" font-size="12" text-anchor="middle" fill="#111">10 s</text><line x1="100.0" y1="50" x2="100.0" y2="60" stroke="#111" stroke-width="2"/><text x="100.0" y="44" font-size="12" text-anchor="start" fill="#111" font-weight="600">Time to first token: 0.5 s</text><line x1="540" y1="50" x2="540" y2="60" stroke="#1f5fbf" stroke-width="2"/><text x="540" y="44" font-size="12" text-anchor="start" fill="#1f5fbf" font-weight="600">Time to first answer token: 6.0 s</text><line x1="60" y1="142" x2="780" y2="142" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="420.0" y="160" font-size="13" text-anchor="middle" fill="#111" font-weight="600">End-to-end time: 9.0 s</text><text x="60" y="188" font-size="13" text-anchor="start" fill="#111">For a reasoning model, TTFT can look fast while you still wait for the answer.</text><text x="60" y="208" font-size="12" text-anchor="start" fill="#555">Time to first answer token measures the wait the same way for reasoning and non-reasoning models (Artificial Analysis).</text></svg>