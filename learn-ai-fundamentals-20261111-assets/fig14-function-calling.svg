<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="The five-step tool calling flow" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>The five-step tool calling flow</title><rect width="900" height="410" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker></defs><rect x="40" y="40" width="260" height="330" rx="10" fill="#f7f7f7" stroke="#111"/><text x="170" y="66" font-size="15" text-anchor="middle" fill="#111" font-weight="600">Your application</text><rect x="600" y="40" width="260" height="330" rx="10" fill="#fff" stroke="#1f5fbf" stroke-width="2"/><text x="730" y="66" font-size="15" text-anchor="middle" fill="#1f5fbf" font-weight="600">Model (via API)</text><line x1="300" y1="100" x2="598" y2="100" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="450" y="92" font-size="13" text-anchor="middle" fill="#111">1. Request + list of tools it could call</text><line x1="600" y1="150" x2="302" y2="150" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="450" y="142" font-size="13" text-anchor="middle" fill="#111">2. Tool call: name + JSON inputs</text><line x1="300" y1="230" x2="598" y2="230" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="450" y="222" font-size="13" text-anchor="middle" fill="#111">4. Second request with the tool output</text><line x1="600" y1="280" x2="302" y2="280" stroke="#111" stroke-width="1.5" marker-end="url(#a)"/><text x="450" y="272" font-size="13" text-anchor="middle" fill="#111">5. Final answer (or more tool calls)</text><rect x="70" y="170" width="200" height="44" rx="6" fill="#111"/><text x="170" y="190" font-size="13" text-anchor="middle" fill="#fff" font-weight="600">3. Your code runs it</text><text x="170" y="206" font-size="11" text-anchor="middle" fill="#ddd">(search, database, email...)</text><text x="450" y="398" font-size="12" text-anchor="middle" fill="#555">If step 5 is another tool call, the loop repeats: that loop is an agent.</text><text x="730" y="200" font-size="12" text-anchor="middle" fill="#555">The model never runs code itself.</text><text x="730" y="218" font-size="12" text-anchor="middle" fill="#555">It only writes structured requests.</text></svg>