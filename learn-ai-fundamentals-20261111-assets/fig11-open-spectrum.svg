<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 165" role="img" aria-label="Spectrum from closed to fully open" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Spectrum from closed to fully open</title><rect width="920" height="165" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker></defs><line x1="40" y1="70" x2="860" y2="70" stroke="#111" stroke-width="2" marker-end="url(#a)"/><circle cx="60" cy="70" r="8" fill="#111"/><text x="60" y="45" text-anchor="middle" font-weight="600">API only</text><text x="60" y="100" text-anchor="middle" font-size="12" fill="#555">use it through</text><text x="60" y="116" text-anchor="middle" font-size="12" fill="#555">the vendor</text><circle cx="330" cy="70" r="8" fill="#111"/><text x="330" y="45" text-anchor="middle" font-weight="600">Open weights</text><text x="330" y="100" text-anchor="middle" font-size="12" fill="#555">download and</text><text x="330" y="116" text-anchor="middle" font-size="12" fill="#555">run the model</text><circle cx="600" cy="70" r="8" fill="#111"/><text x="600" y="45" text-anchor="middle" font-weight="600">Weights + code</text><text x="600" y="100" text-anchor="middle" font-size="12" fill="#555">plus training</text><text x="600" y="116" text-anchor="middle" font-size="12" fill="#555">and run code</text><circle cx="840" cy="70" r="8" fill="#111"/><text x="840" y="45" text-anchor="middle" font-weight="600">Open source AI</text><text x="840" y="100" text-anchor="middle" font-size="12" fill="#555">weights, code, and</text><text x="840" y="116" text-anchor="middle" font-size="12" fill="#555">data information</text><text x="450" y="150" text-anchor="middle" font-size="12" fill="#555">Licenses can add limits at any point on this line. Read the license, not the label.</text></svg>