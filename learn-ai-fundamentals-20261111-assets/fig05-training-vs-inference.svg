<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 905 215" role="img" aria-label="Training stages versus inference" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Training stages versus inference</title><rect width="905" height="215" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker></defs><rect x="20" y="40" width="190" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="115" y="70" text-anchor="middle" font-weight="600" fill="#111">Pretraining</text><text x="115" y="94" text-anchor="middle" font-size="12" fill="#555">read huge text</text><text x="115" y="112" text-anchor="middle" font-size="12" fill="#555">(e.g. 15T tokens)</text><line x1="210" y1="85" x2="245" y2="85" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="245" y="40" width="190" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="340" y="70" text-anchor="middle" font-weight="600" fill="#111">Supervised fine-tuning</text><text x="340" y="94" text-anchor="middle" font-size="12" fill="#555">learn from example</text><text x="340" y="112" text-anchor="middle" font-size="12" fill="#555">conversations</text><line x1="435" y1="85" x2="470" y2="85" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="470" y="40" width="190" height="90" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="565" y="70" text-anchor="middle" font-weight="600" fill="#111">RL / human feedback</text><text x="565" y="94" text-anchor="middle" font-size="12" fill="#555">learn from rankings</text><text x="565" y="112" text-anchor="middle" font-size="12" fill="#555">and rewards</text><line x1="660" y1="85" x2="695" y2="85" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="695" y="40" width="190" height="90" rx="6" fill="#111" stroke="#111" stroke-width="1.5"/><text x="790" y="70" text-anchor="middle" font-weight="600" fill="#fff">Deployed model</text><text x="790" y="94" text-anchor="middle" font-size="12" fill="#ddd">weights frozen</text><text x="790" y="112" text-anchor="middle" font-size="12" fill="#ddd"></text><line x1="20" y1="160" x2="660" y2="160" stroke="#999"/><text x="340" y="182" text-anchor="middle" font-size="13">TRAINING: months, thousands of chips, changes the weights</text><line x1="695" y1="160" x2="885" y2="160" stroke="#999"/><text x="790" y="182" text-anchor="middle" font-size="13">INFERENCE: every chat</text><text x="790" y="200" text-anchor="middle" font-size="12" fill="#555">reads weights, never changes them</text></svg>