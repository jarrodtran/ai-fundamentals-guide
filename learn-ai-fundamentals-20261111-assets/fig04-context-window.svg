<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 440" role="img" aria-label="What fills a context window" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>What fills a context window</title><rect width="830" height="440" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker></defs><rect x="40" y="40" width="420" height="380" fill="none" stroke="#111" stroke-width="2"/><text x="250" y="28" font-size="15" text-anchor="middle" fill="#111" font-weight="600">One context window (fixed size, example proportions)</text><rect x="40" y="40" width="420" height="40" fill="#e6e6e6" stroke="#999"/><text x="250" y="65.0" font-size="14" text-anchor="middle" fill="#111">System prompt / instructions</text><rect x="40" y="80" width="420" height="34" fill="#f2f2f2" stroke="#999"/><text x="250" y="102.0" font-size="14" text-anchor="middle" fill="#111">Tool definitions</text><rect x="40" y="114" width="420" height="28" fill="#e6e6e6" stroke="#999"/><text x="250" y="133.0" font-size="14" text-anchor="middle" fill="#111">Examples</text><rect x="40" y="142" width="420" height="70" fill="#dfe8f6" stroke="#999"/><text x="250" y="182.0" font-size="14" text-anchor="middle" fill="#111">Retrieved documents</text><rect x="40" y="212" width="420" height="80" fill="#f2f2f2" stroke="#999"/><text x="250" y="257.0" font-size="14" text-anchor="middle" fill="#111">Earlier turns and tool results</text><rect x="40" y="292" width="420" height="34" fill="#e6e6e6" stroke="#999"/><text x="250" y="314.0" font-size="14" text-anchor="middle" fill="#111">Your question (put it last)</text><rect x="40" y="326" width="420" height="44" fill="#fff" stroke="#999"/><text x="250" y="353.0" font-size="14" text-anchor="middle" fill="#111">Reasoning tokens (if any)</text><rect x="40" y="370" width="420" height="50" fill="#fff" stroke="#999"/><text x="250" y="400.0" font-size="14" text-anchor="middle" fill="#111">The reply</text><rect x="40" y="142" width="420" height="70" fill="none" stroke="#1f5fbf" stroke-width="2.5"/><text x="490" y="110" font-size="13" text-anchor="start" fill="#111">Every token here competes for the</text><text x="490" y="128" font-size="13" text-anchor="start" fill="#111">model's limited "attention budget"</text><text x="490" y="146" font-size="13" text-anchor="start" fill="#111">(Anthropic).</text><text x="490" y="200" font-size="13" text-anchor="start" fill="#111">Context engineering: keep the</text><text x="490" y="218" font-size="13" text-anchor="start" fill="#111">smallest set of high-signal tokens.</text><text x="490" y="236" font-size="13" text-anchor="start" fill="#111">Trim stale history and unused tools.</text><text x="490" y="330" font-size="13" text-anchor="start" fill="#111">Reasoning and the reply are counted</text><text x="490" y="348" font-size="13" text-anchor="start" fill="#111">in the same budget as your input.</text></svg>