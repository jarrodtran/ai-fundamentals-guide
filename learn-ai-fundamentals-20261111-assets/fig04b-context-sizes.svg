<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="Context window sizes" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Context window sizes</title><rect width="900" height="300" fill="#fff"/><text x="20" y="24" font-size="13" text-anchor="start" fill="#555">Published context windows in tokens, from vendor model pages (Nov 11, 2026)</text><text x="320" y="64" font-size="13" text-anchor="end" fill="#111">GPT-2 (2019)</text><rect x="330" y="44" width="1" height="28" fill="#888"/><text x="339" y="63" font-size="13" text-anchor="start" fill="#111" font-weight="600">1,024 tokens (too small to see)</text><text x="320" y="110" font-size="13" text-anchor="end" fill="#111">Older models, e.g. Claude Haiku 4.5</text><rect x="330" y="90" width="91.42857142857142" height="28" fill="#888"/><text x="429.42857142857144" y="109" font-size="13" text-anchor="start" fill="#111" font-weight="600">200K</text><text x="320" y="156" font-size="13" text-anchor="end" fill="#111">Gemini 4 Carbon / Argon</text><rect x="330" y="136" width="457.1428571428571" height="28" fill="#1f5fbf"/><text x="779.1428571428571" y="155" font-size="13" text-anchor="end" fill="#fff" font-weight="600">1M</text><text x="320" y="202" font-size="13" text-anchor="end" fill="#111">Claude Opus 5.5 and other current Claude</text><rect x="330" y="182" width="457.1428571428571" height="28" fill="#1f5fbf"/><text x="779.1428571428571" y="201" font-size="13" text-anchor="end" fill="#fff" font-weight="600">1M</text><text x="320" y="248" font-size="13" text-anchor="end" fill="#111">GPT-6 Astra and other current GPT-6</text><rect x="330" y="228" width="480.0" height="28" fill="#1f5fbf"/><text x="802.0" y="247" font-size="13" text-anchor="end" fill="#fff" font-weight="600">1.05M</text><text x="330" y="288" font-size="12" text-anchor="start" fill="#555">1M tokens is roughly 750,000 English words (OpenAI rule of thumb, an estimate)</text></svg>