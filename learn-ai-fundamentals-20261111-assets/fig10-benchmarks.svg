<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" role="img" aria-label="Three ways to evaluate a model" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Three ways to evaluate a model</title><rect width="920" height="210" fill="#fff"/><rect x="20" y="20" width="280" height="150" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="160" y="50" text-anchor="middle" font-weight="600" fill="#111">Fixed test sets</text><text x="160" y="82" text-anchor="middle" font-size="13" fill="#555">Same questions for every model,</text><text x="160" y="100" text-anchor="middle" font-size="13" fill="#555">scored automatically.</text><text x="160" y="140" text-anchor="middle" font-size="12" fill="#111">Risk: tuned to the test.</text><rect x="320" y="20" width="280" height="150" rx="8" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="460" y="50" text-anchor="middle" font-weight="600" fill="#111">Human preference (Arena)</text><text x="460" y="82" text-anchor="middle" font-size="13" fill="#555">People vote between two</text><text x="460" y="100" text-anchor="middle" font-size="13" fill="#555">anonymous answers.</text><text x="460" y="140" text-anchor="middle" font-size="12" fill="#111">Risk: style wins; uneven sampling.</text><rect x="620" y="20" width="280" height="150" rx="8" fill="#111" stroke="#111" stroke-width="1.5"/><text x="760" y="50" text-anchor="middle" font-weight="600" fill="#fff">Your own evals</text><text x="760" y="82" text-anchor="middle" font-size="13" fill="#ddd">Your real tasks, your</text><text x="760" y="100" text-anchor="middle" font-size="13" fill="#ddd">definition of good.</text><text x="760" y="140" text-anchor="middle" font-size="12" fill="#fff">Cost: you build and keep it.</text><text x="460" y="198" text-anchor="middle" font-size="12" fill="#555">Public scores shortlist models. Your own evals pick one.</text></svg>