<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img" aria-label="Memory needed for model weights" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Memory needed for model weights</title><rect width="900" height="395" fill="#fff"/><text x="20" y="22" font-size="14" text-anchor="start" fill="#111" font-weight="600">A. Weight memory for an 8B model (Hugging Face)</text><text x="140" y="60" font-size="13" text-anchor="end" fill="#111">bf16 (16-bit)</text><rect x="150" y="40" width="416" height="28" fill="#888"/><text x="574" y="59" font-size="13" text-anchor="start" fill="#111">about 16 GB</text><text x="140" y="102" font-size="13" text-anchor="end" fill="#111">8-bit</text><rect x="150" y="82" width="208" height="28" fill="#888"/><text x="366" y="101" font-size="13" text-anchor="start" fill="#111">about 8 GB</text><text x="140" y="144" font-size="13" text-anchor="end" fill="#111">4-bit</text><rect x="150" y="124" width="117.0" height="28" fill="#1f5fbf"/><text x="275.0" y="143" font-size="13" text-anchor="start" fill="#111">about 4 to 5 GB</text><text x="20" y="200" font-size="14" text-anchor="start" fill="#111" font-weight="600">B. File size before and after Q4_K_M quantization (llama.cpp README; bars scaled within each row)</text><text x="140" y="238" font-size="14" text-anchor="end" fill="#111" font-weight="600">8B</text><rect x="150" y="218" width="560" height="18" fill="#ddd"/><text x="718" y="232" font-size="12" text-anchor="start" fill="#111">32.1 GB original (32-bit)</text><rect x="150" y="238" width="85.5" height="18" fill="#1f5fbf"/><text x="243.4828660436137" y="252" font-size="12" text-anchor="start" fill="#1f5fbf" font-weight="600">4.9 GB at Q4_K_M</text><text x="140" y="288" font-size="14" text-anchor="end" fill="#111" font-weight="600">70B</text><rect x="150" y="268" width="560" height="18" fill="#ddd"/><text x="718" y="282" font-size="12" text-anchor="start" fill="#111">280.9 GB original (32-bit)</text><rect x="150" y="288" width="85.9" height="18" fill="#1f5fbf"/><text x="243.9238163047348" y="302" font-size="12" text-anchor="start" fill="#1f5fbf" font-weight="600">43.1 GB at Q4_K_M</text><text x="140" y="338" font-size="14" text-anchor="end" fill="#111" font-weight="600">405B</text><rect x="150" y="318" width="560" height="18" fill="#ddd"/><text x="718" y="332" font-size="12" text-anchor="start" fill="#111">1,625.1 GB original (32-bit)</text><rect x="150" y="338" width="85.8" height="18" fill="#1f5fbf"/><text x="243.83840994400344" y="352" font-size="12" text-anchor="start" fill="#1f5fbf" font-weight="600">249.1 GB at Q4_K_M</text><text x="20" y="382" font-size="12" text-anchor="start" fill="#555">Weights only. Running a model also needs memory for the context, so leave headroom.</text></svg>