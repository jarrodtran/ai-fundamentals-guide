<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 320" role="img" aria-label="How the price of a fixed capability has fallen" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>How the price of a fixed capability has fallen</title><rect width="910" height="320" fill="#fff"/><text x="20" y="22" font-size="13" text-anchor="start" fill="#555">Cheapest model at or above GPT-4's original MMLU score, USD per 1M tokens (Epoch AI 2025 data)</text><line x1="80" y1="270" x2="600" y2="270" stroke="#111"/><line x1="80" y1="270" x2="80" y2="50" stroke="#111"/><line x1="80" y1="270.0" x2="600" y2="270.0" stroke="#eee"/><text x="72" y="274.0" font-size="12" text-anchor="end" fill="#111">$0.1</text><line x1="80" y1="196.66666666666669" x2="600" y2="196.66666666666669" stroke="#eee"/><text x="72" y="200.66666666666669" font-size="12" text-anchor="end" fill="#111">$1</text><line x1="80" y1="123.33333333333334" x2="600" y2="123.33333333333334" stroke="#eee"/><text x="72" y="127.33333333333334" font-size="12" text-anchor="end" fill="#111">$10</text><line x1="80" y1="50.0" x2="600" y2="50.0" stroke="#eee"/><text x="72" y="54.0" font-size="12" text-anchor="end" fill="#111">$100</text><text x="80.0" y="288" font-size="12" text-anchor="middle" fill="#111">2023</text><text x="295.1927437641723" y="288" font-size="12" text-anchor="middle" fill="#111">2024</text><text x="510.9750566893424" y="288" font-size="12" text-anchor="middle" fill="#111">2025</text><polyline points="122.4,81.2 262.2,110.4 373.6,132.5 379.5,171.7 531.6,251.3" fill="none" stroke="#1f5fbf" stroke-width="2"/><circle cx="122.4" cy="81.2" r="5" fill="#1f5fbf"/><text x="130.44897959183675" y="73.23770703330061" font-size="12" text-anchor="start" fill="#111">GPT-4-0314: $37.50</text><circle cx="262.2" cy="110.4" r="5" fill="#1f5fbf"/><text x="270.1768707482993" y="102.41997433591669" font-size="12" text-anchor="start" fill="#111">GPT-4 Turbo: $15.00</text><circle cx="373.6" cy="132.5" r="5" fill="#1f5fbf"/><text x="383.6054421768707" y="126.49550735127534" font-size="12" text-anchor="start" fill="#111">GPT-4o (2024-05): $7.50</text><circle cx="379.5" cy="171.7" r="5" fill="#1f5fbf"/><text x="389.5011337868481" y="167.70076491172466" font-size="12" text-anchor="start" fill="#111">Gemini 1.5 Pro (2024-05): $2.19</text><circle cx="531.6" cy="251.3" r="5" fill="#1f5fbf"/><text x="519.6099773242631" y="255.28001629242422" font-size="12" text-anchor="end" fill="#111">Gemini 2.0 Flash: $0.18</text><text x="80" y="310" font-size="12" text-anchor="start" fill="#555">Log scale: each gridline is 10 times the one below. Prices blend input and output 3:1.</text><rect x="630" y="50" width="260" height="220" rx="8" fill="#fff" stroke="#111"/><text x="644" y="76" font-size="14" text-anchor="start" fill="#111" font-weight="600">Headline rates</text><text x="644" y="102" font-size="13" text-anchor="start" fill="#1f5fbf" font-weight="600">Epoch 2026: about 13x cheaper</text><text x="644" y="120" font-size="13" text-anchor="start" fill="#111">per year to reach a given</text><text x="644" y="138" font-size="13" text-anchor="start" fill="#111">performance level (since 2023)</text><text x="644" y="170" font-size="13" text-anchor="start" fill="#111" font-weight="600">Epoch 2025: median 50x per year,</text><text x="644" y="188" font-size="13" text-anchor="start" fill="#111">range 9x to 900x (price per</text><text x="644" y="206" font-size="13" text-anchor="start" fill="#111">token above a score threshold)</text><text x="644" y="238" font-size="12" text-anchor="start" fill="#555">Different methods, different</text><text x="644" y="254" font-size="12" text-anchor="start" fill="#555">answers. Same research group.</text></svg>