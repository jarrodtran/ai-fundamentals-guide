<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 253" role="img" aria-label="Timeline of one streamed response" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Timeline of one streamed response</title><rect width="960" height="253" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker></defs><text x="20" y="22" font-size="13" text-anchor="start" fill="#555">Example numbers only: first token at 0.8 s, last token at 5.8 s, 500 output tokens</text><g transform="translate(0,18)"><rect x="60" y="44" width="104.0" height="40" fill="#bbb"/><text x="112.0" y="69" font-size="12" text-anchor="middle" fill="#111">wait</text><rect x="164.0" y="44" width="650" height="40" fill="#111"/><text x="489.0" y="69" font-size="12" text-anchor="middle" fill="#fff">500 tokens stream in</text><line x1="60" y1="88" x2="60" y2="95" stroke="#111"/><text x="60" y="110" font-size="12" text-anchor="middle" fill="#111">0 s</text><line x1="190" y1="88" x2="190" y2="95" stroke="#111"/><text x="190" y="110" font-size="12" text-anchor="middle" fill="#111">1 s</text><line x1="320" y1="88" x2="320" y2="95" stroke="#111"/><text x="320" y="110" font-size="12" text-anchor="middle" fill="#111">2 s</text><line x1="450" y1="88" x2="450" y2="95" stroke="#111"/><text x="450" y="110" font-size="12" text-anchor="middle" fill="#111">3 s</text><line x1="580" y1="88" x2="580" y2="95" stroke="#111"/><text x="580" y="110" font-size="12" text-anchor="middle" fill="#111">4 s</text><line x1="710" y1="88" x2="710" y2="95" stroke="#111"/><text x="710" y="110" font-size="12" text-anchor="middle" fill="#111">5 s</text><line x1="840" y1="88" x2="840" y2="95" stroke="#111"/><text x="840" y="110" font-size="12" text-anchor="middle" fill="#111">6 s</text><line x1="164.0" y1="36" x2="164.0" y2="44" stroke="#1f5fbf" stroke-width="2"/><text x="164.0" y="32" font-size="12" text-anchor="middle" fill="#1f5fbf" font-weight="600">TTFT 0.8 s</text><line x1="60" y1="128" x2="814.0" y2="128" stroke="#1f5fbf" stroke-width="2" marker-end="url(#b)"/><text x="437.0" y="146" font-size="13" text-anchor="middle" fill="#1f5fbf" font-weight="600">End-to-end time = 5.8 s</text><text x="60" y="176" font-size="13" text-anchor="start" fill="#111">Old AA output speed (after first token): 500 / 5.0 s = 100 tokens per second</text><text x="60" y="198" font-size="13" text-anchor="start" fill="#111" font-weight="600">New AA output speed (whole request, since Nov 3, 2026): 500 / 5.8 s = about 86 tokens per second</text><text x="60" y="220" font-size="12" text-anchor="start" fill="#555">Same response, different number. Token counts now come from each provider's own API.</text></g></svg>