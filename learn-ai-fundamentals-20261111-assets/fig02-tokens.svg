<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-label="How a sentence splits into tokens" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>How a sentence splits into tokens</title><rect width="900" height="290" fill="#fff"/><text x="20" y="24" font-size="13" fill="#555">English sentence, 100 characters, 19 words = 20 tokens (o200k_base)</text><rect x="20" y="40" width="35.8" height="32" fill="#f2f2f2" stroke="#999"/><text x="37.9" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">The</text><rect x="57.8" y="40" width="61.599999999999994" height="32" fill="#d9d9d9" stroke="#999"/><text x="88.6" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·quick</text><rect x="121.39999999999999" y="40" width="61.599999999999994" height="32" fill="#f2f2f2" stroke="#999"/><text x="152.2" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·brown</text><rect x="185.0" y="40" width="44.4" height="32" fill="#d9d9d9" stroke="#999"/><text x="207.2" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·fox</text><rect x="231.4" y="40" width="61.599999999999994" height="32" fill="#f2f2f2" stroke="#999"/><text x="262.2" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·jumps</text><rect x="295.0" y="40" width="53.0" height="32" fill="#d9d9d9" stroke="#999"/><text x="321.5" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·over</text><rect x="350.0" y="40" width="44.4" height="32" fill="#f2f2f2" stroke="#999"/><text x="372.2" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·the</text><rect x="396.4" y="40" width="53.0" height="32" fill="#d9d9d9" stroke="#999"/><text x="422.9" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·lazy</text><rect x="451.4" y="40" width="44.4" height="32" fill="#f2f2f2" stroke="#999"/><text x="473.59999999999997" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·dog</text><rect x="497.79999999999995" y="40" width="78.8" height="32" fill="#d9d9d9" stroke="#999"/><text x="537.1999999999999" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·because</text><rect x="578.5999999999999" y="40" width="35.8" height="32" fill="#f2f2f2" stroke="#999"/><text x="596.4999999999999" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·it</text><rect x="616.3999999999999" y="40" width="61.599999999999994" height="32" fill="#d9d9d9" stroke="#999"/><text x="647.1999999999998" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·wants</text><rect x="679.9999999999999" y="40" width="35.8" height="32" fill="#f2f2f2" stroke="#999"/><text x="697.8999999999999" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·to</text><rect x="717.7999999999998" y="40" width="61.599999999999994" height="32" fill="#d9d9d9" stroke="#999"/><text x="748.5999999999998" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·learn</text><rect x="781.3999999999999" y="40" width="44.4" height="32" fill="#f2f2f2" stroke="#999"/><text x="803.5999999999999" y="61" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·how</text><rect x="20" y="84" width="87.39999999999999" height="32" fill="#d9d9d9" stroke="#999"/><text x="63.699999999999996" y="105" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·language</text><rect x="109.39999999999999" y="84" width="70.19999999999999" height="32" fill="#f2f2f2" stroke="#999"/><text x="144.5" y="105" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·models</text><rect x="181.59999999999997" y="84" width="53.0" height="32" fill="#d9d9d9" stroke="#999"/><text x="208.09999999999997" y="105" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·read</text><rect x="236.59999999999997" y="84" width="53.0" height="32" fill="#f2f2f2" stroke="#999"/><text x="263.09999999999997" y="105" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·text</text><rect x="291.59999999999997" y="84" width="24" height="32" fill="#d9d9d9" stroke="#999"/><text x="303.59999999999997" y="105" text-anchor="middle" font-family="Menlo,monospace" font-size="13">.</text><text x="20" y="144" font-size="13" fill="#555">Same word, different tokens depending on spacing and capitals</text><text x="20" y="175" font-family="Menlo,monospace" font-size="13">strawberry</text><rect x="300" y="154" width="31.2" height="32" fill="#f2f2f2" stroke="#999"/><text x="315.6" y="175" text-anchor="middle" font-family="Menlo,monospace" font-size="13">st</text><rect x="333.2" y="154" width="39.8" height="32" fill="#d9d9d9" stroke="#999"/><text x="353.09999999999997" y="175" text-anchor="middle" font-family="Menlo,monospace" font-size="13">raw</text><rect x="375.0" y="154" width="57.0" height="32" fill="#f2f2f2" stroke="#999"/><text x="403.5" y="175" text-anchor="middle" font-family="Menlo,monospace" font-size="13">berry</text><text x="446.0" y="175" font-size="12" fill="#555">3 tokens</text><text x="20" y="217" font-family="Menlo,monospace" font-size="13">·strawberry (leading space)</text><rect x="300" y="196" width="108.6" height="32" fill="#f2f2f2" stroke="#999"/><text x="354.3" y="217" text-anchor="middle" font-family="Menlo,monospace" font-size="13">·strawberry</text><text x="422.6" y="217" font-size="12" fill="#555">1 token</text><text x="20" y="259" font-family="Menlo,monospace" font-size="13">Strawberry</text><rect x="300" y="238" width="39.8" height="32" fill="#f2f2f2" stroke="#999"/><text x="319.9" y="259" text-anchor="middle" font-family="Menlo,monospace" font-size="13">Str</text><rect x="341.8" y="238" width="31.2" height="32" fill="#d9d9d9" stroke="#999"/><text x="357.40000000000003" y="259" text-anchor="middle" font-family="Menlo,monospace" font-size="13">aw</text><rect x="375.0" y="238" width="57.0" height="32" fill="#f2f2f2" stroke="#999"/><text x="403.5" y="259" text-anchor="middle" font-family="Menlo,monospace" font-size="13">berry</text><text x="446.0" y="259" font-size="12" fill="#555">3 tokens</text></svg>