<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" role="img" aria-label="Token counts for the same sentence in three languages" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Token counts for the same sentence in three languages</title><rect width="900" height="215" fill="#fff"/><text x="20" y="24" font-size="13" text-anchor="start" fill="#555">Same sentence, tokens counted with o200k_base (measured for this guide, Nov 11, 2026)</text><text x="120" y="72" font-size="15" text-anchor="end" fill="#111">English</text><rect x="130" y="50" width="195.55555555555554" height="32" fill="#1f5fbf"/><text x="333.55555555555554" y="71" font-size="13" text-anchor="start" fill="#111">20 tokens, 100 characters (5.0 characters per token)</text><text x="120" y="124" font-size="15" text-anchor="end" fill="#111">Spanish</text><rect x="130" y="102" width="244.44444444444446" height="32" fill="#888"/><text x="382.44444444444446" y="123" font-size="13" text-anchor="start" fill="#111">25 tokens, 116 characters (4.6 characters per token)</text><text x="120" y="176" font-size="15" text-anchor="end" fill="#111">Japanese</text><rect x="130" y="154" width="410.6666666666667" height="32" fill="#888"/><text x="548.6666666666667" y="175" font-size="13" text-anchor="start" fill="#111">42 tokens, 48 characters (1.1 characters per token)</text></svg>