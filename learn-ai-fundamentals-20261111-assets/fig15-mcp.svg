<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="MCP hosts, clients, and servers" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>MCP hosts, clients, and servers</title><rect width="960" height="390" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker></defs><rect x="30" y="40" width="360" height="300" rx="12" fill="#f7f7f7" stroke="#111"/><text x="210" y="64" font-size="15" text-anchor="middle" fill="#111" font-weight="600">Host (the AI app you use)</text><rect x="60" y="150" width="120" height="70" rx="8" fill="#111"/><text x="120" y="190" font-size="14" text-anchor="middle" fill="#fff" font-weight="600">Model</text><rect x="230" y="88" width="130" height="40" rx="6" fill="#fff" stroke="#111"/><text x="295" y="113" font-size="13" text-anchor="middle" fill="#111">Client 1</text><line x1="180" y1="185" x2="228" y2="108" stroke="#999"/><line x1="362" y1="108" x2="548" y2="108" stroke="#1f5fbf" stroke-width="1.5" marker-end="url(#b)"/><line x1="548" y1="116" x2="364" y2="116" stroke="#1f5fbf" stroke-width="1.5" marker-end="url(#b)"/><rect x="550" y="84" width="190" height="48" rx="6" fill="#fff" stroke="#1f5fbf" stroke-width="2"/><text x="645" y="113" font-size="13" text-anchor="middle" fill="#111" font-weight="600">Calendar server</text><rect x="230" y="178" width="130" height="40" rx="6" fill="#fff" stroke="#111"/><text x="295" y="203" font-size="13" text-anchor="middle" fill="#111">Client 2</text><line x1="180" y1="185" x2="228" y2="198" stroke="#999"/><line x1="362" y1="198" x2="548" y2="198" stroke="#1f5fbf" stroke-width="1.5" marker-end="url(#b)"/><line x1="548" y1="206" x2="364" y2="206" stroke="#1f5fbf" stroke-width="1.5" marker-end="url(#b)"/><rect x="550" y="174" width="190" height="48" rx="6" fill="#fff" stroke="#1f5fbf" stroke-width="2"/><text x="645" y="203" font-size="13" text-anchor="middle" fill="#111" font-weight="600">Database server</text><rect x="230" y="268" width="130" height="40" rx="6" fill="#fff" stroke="#111"/><text x="295" y="293" font-size="13" text-anchor="middle" fill="#111">Client 3</text><line x1="180" y1="185" x2="228" y2="288" stroke="#999"/><line x1="362" y1="288" x2="548" y2="288" stroke="#1f5fbf" stroke-width="1.5" marker-end="url(#b)"/><line x1="548" y1="296" x2="364" y2="296" stroke="#1f5fbf" stroke-width="1.5" marker-end="url(#b)"/><rect x="550" y="264" width="190" height="48" rx="6" fill="#fff" stroke="#1f5fbf" stroke-width="2"/><text x="645" y="293" font-size="13" text-anchor="middle" fill="#111" font-weight="600">Company wiki server</text><text x="455" y="80" font-size="12" text-anchor="middle" fill="#1f5fbf" font-weight="600">JSON-RPC 2.0 messages</text><text x="760" y="100" font-size="13" text-anchor="start" fill="#111" font-weight="600">Servers can offer:</text><text x="760" y="122" font-size="12" text-anchor="start" fill="#111">Resources: context and data</text><text x="760" y="140" font-size="12" text-anchor="start" fill="#111">Prompts: templated workflows</text><text x="760" y="158" font-size="12" text-anchor="start" fill="#111">Tools: functions the model runs</text><text x="760" y="210" font-size="13" text-anchor="start" fill="#111" font-weight="600">Clients can offer:</text><text x="760" y="232" font-size="12" text-anchor="start" fill="#111">Elicitation: asking the user</text><text x="760" y="250" font-size="12" text-anchor="start" fill="#111">for more information</text><text x="450" y="370" font-size="13" text-anchor="middle" fill="#111">Spec rule: "Hosts must obtain explicit user consent before invoking any tool."</text></svg>