<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img" aria-label="Embedding space and the RAG flow" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>Embedding space and the RAG flow</title><rect width="820" height="260" fill="#fff"/><text x="20" y="22" font-size="13" fill="#555">Embeddings: text becomes a point; similar meaning lands close (sketch, real spaces have thousands of dimensions)</text><rect x="30" y="40" width="400" height="200" fill="none" stroke="#ccc"/><circle cx="80" cy="80" r="4" fill="#111"/><text x="88" y="84" font-size="12">invoice</text><circle cx="120" cy="100" r="4" fill="#111"/><text x="128" y="104" font-size="12">receipt</text><circle cx="95" cy="125" r="4" fill="#111"/><text x="103" y="129" font-size="12">bill</text><circle cx="330" cy="70" r="4" fill="#111"/><text x="338" y="74" font-size="12">puppy</text><circle cx="360" cy="100" r="4" fill="#111"/><text x="368" y="104" font-size="12">dog</text><circle cx="305" cy="115" r="4" fill="#111"/><text x="313" y="119" font-size="12">kitten</text><circle cx="210" cy="200" r="4" fill="#111"/><text x="218" y="204" font-size="12">forklift</text><circle cx="250" cy="215" r="4" fill="#111"/><text x="258" y="219" font-size="12">pallet</text><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker></defs><rect x="500" y="40" width="190" height="34" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="595.0" y="62.0" text-anchor="middle" font-size="13"  fill="#111">Question</text><line x1="595" y1="74" x2="595" y2="82" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="500" y="82" width="190" height="34" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="595.0" y="104.0" text-anchor="middle" font-size="13"  fill="#111">Embed it</text><line x1="595" y1="116" x2="595" y2="124" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="500" y="124" width="190" height="34" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="595.0" y="146.0" text-anchor="middle" font-size="12"  fill="#111">Find nearest chunks in index</text><line x1="595" y1="158" x2="595" y2="166" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="500" y="166" width="190" height="34" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="595.0" y="188.0" text-anchor="middle" font-size="12"  fill="#111">Paste chunks into context</text><line x1="595" y1="200" x2="595" y2="208" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="500" y="208" width="190" height="34" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="595.0" y="230.0" text-anchor="middle" font-size="12"  fill="#111">Model answers with sources</text><text x="710" y="140" font-size="12" fill="#555">RAG: Retrieval-</text><text x="710" y="156" font-size="12" fill="#555">Augmented</text><text x="710" y="172" font-size="12" fill="#555">Generation</text></svg>