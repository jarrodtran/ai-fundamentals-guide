<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 332" role="img" aria-label="How test leakage inflates benchmark scores" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>How test leakage inflates benchmark scores</title><rect width="920" height="332" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#111"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1f5fbf"/></marker></defs><rect x="20" y="40" width="190" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="115" y="70" font-size="13" text-anchor="middle" fill="#111" font-weight="600">Benchmark questions</text><text x="115" y="90" font-size="13" text-anchor="middle" fill="#555">published online</text><line x1="210" y1="75" x2="245" y2="75" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="245" y="40" width="190" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="340" y="70" font-size="13" text-anchor="middle" fill="#111" font-weight="600">Web scrapes become</text><text x="340" y="90" font-size="13" text-anchor="middle" fill="#555">pretraining datasets</text><line x1="435" y1="75" x2="470" y2="75" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="470" y="40" width="190" height="70" rx="6" fill="#fff" stroke="#111" stroke-width="1.5"/><text x="565" y="70" font-size="13" text-anchor="middle" fill="#111" font-weight="600">Model trains on</text><text x="565" y="90" font-size="13" text-anchor="middle" fill="#555">those datasets</text><line x1="660" y1="75" x2="695" y2="75" stroke="#111" stroke-width="1.5" marker-end="url(#a)" /><rect x="695" y="40" width="190" height="70" rx="6" fill="#1f5fbf" stroke="#1f5fbf" stroke-width="1.5"/><text x="790" y="70" font-size="13" text-anchor="middle" fill="#fff" font-weight="600">Model is scored on</text><text x="790" y="90" font-size="13" text-anchor="middle" fill="#fff">the same benchmark</text><text x="810" y="128" font-size="12" text-anchor="middle" fill="#1f5fbf">score looks better than</text><text x="810" y="144" font-size="12" text-anchor="middle" fill="#1f5fbf">the real ability</text><rect x="245" y="170" width="420" height="120" rx="8" fill="#fff" stroke="#111"/><text x="455" y="194" font-size="13" text-anchor="middle" fill="#111" font-weight="600">Yang et al. 2023, measured in two specific datasets:</text><text x="455" y="220" font-size="14" text-anchor="middle" fill="#1f5fbf" font-weight="600">8 to 18% of the HumanEval coding benchmark overlaps</text><text x="455" y="240" font-size="14" text-anchor="middle" fill="#1f5fbf" font-weight="600">with RedPajama-Data-1T and StarCoder-Data</text><text x="455" y="266" font-size="12" text-anchor="middle" fill="#555">(pretraining datasets, not a rate for any particular model)</text><line x1="340" y1="112" x2="400" y2="168" stroke="#999" stroke-dasharray="4 3"/><text x="20" y="318" font-size="12" text-anchor="start" fill="#555">Why filters miss it: paraphrased or translated test questions slip past exact-match checks (Yang et al.).</text></svg>