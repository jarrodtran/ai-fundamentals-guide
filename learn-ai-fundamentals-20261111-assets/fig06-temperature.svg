<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" role="img" aria-label="How temperature reshapes next-token odds" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15"><title>How temperature reshapes next-token odds</title><rect width="900" height="290" fill="#fff"/><text x="20" y="22" font-size="13" fill="#555">Example numbers: one fixed set of model scores, re-shaped by temperature. "The quick brown fox jumped over the lazy ___"</text><text x="160" y="52" text-anchor="middle" font-weight="600">Temperature 0.2</text><line x1="30" y1="230" x2="290" y2="230" stroke="#111"/><rect x="40" y="73.03999999999999" width="36" height="156.96" fill="#111"/><text x="58" y="68.03999999999999" text-anchor="middle" font-size="11">98.1%</text><text x="58" y="246" text-anchor="middle" font-size="12">dog</text><rect x="90" y="227.12" width="36" height="2.8800000000000003" fill="#888"/><text x="108" y="222.12" text-anchor="middle" font-size="11">1.8%</text><text x="108" y="246" text-anchor="middle" font-size="12">cat</text><rect x="140" y="229.84" width="36" height="0.16" fill="#888"/><text x="158" y="224.84" text-anchor="middle" font-size="11">0.1%</text><text x="158" y="246" text-anchor="middle" font-size="12">fox</text><rect x="190" y="230.0" width="36" height="0.0" fill="#888"/><text x="208" y="225.0" text-anchor="middle" font-size="11">0%</text><text x="208" y="246" text-anchor="middle" font-size="12">car</text><rect x="240" y="230.0" width="36" height="0.0" fill="#888"/><text x="258" y="225.0" text-anchor="middle" font-size="11">0%</text><text x="258" y="246" text-anchor="middle" font-size="12">moon</text><text x="455" y="52" text-anchor="middle" font-weight="600">Temperature 1.0</text><line x1="325" y1="230" x2="585" y2="230" stroke="#111"/><rect x="335" y="143.76" width="36" height="86.24000000000001" fill="#111"/><text x="353" y="138.76" text-anchor="middle" font-size="11">53.9%</text><text x="353" y="246" text-anchor="middle" font-size="12">dog</text><rect x="385" y="191.28" width="36" height="38.72" fill="#888"/><text x="403" y="186.28" text-anchor="middle" font-size="11">24.2%</text><text x="403" y="246" text-anchor="middle" font-size="12">cat</text><rect x="435" y="208.72" width="36" height="21.28" fill="#888"/><text x="453" y="203.72" text-anchor="middle" font-size="11">13.3%</text><text x="453" y="246" text-anchor="middle" font-size="12">fox</text><rect x="485" y="220.4" width="36" height="9.6" fill="#888"/><text x="503" y="215.4" text-anchor="middle" font-size="11">6%</text><text x="503" y="246" text-anchor="middle" font-size="12">car</text><rect x="535" y="225.68" width="36" height="4.32" fill="#888"/><text x="553" y="220.68" text-anchor="middle" font-size="11">2.7%</text><text x="553" y="246" text-anchor="middle" font-size="12">moon</text><text x="750" y="52" text-anchor="middle" font-weight="600">Temperature 1.5</text><line x1="620" y1="230" x2="880" y2="230" stroke="#111"/><rect x="630" y="161.84" width="36" height="68.16" fill="#111"/><text x="648" y="156.84" text-anchor="middle" font-size="11">42.6%</text><text x="648" y="246" text-anchor="middle" font-size="12">dog</text><rect x="680" y="190.0" width="36" height="40.0" fill="#888"/><text x="698" y="185.0" text-anchor="middle" font-size="11">25%</text><text x="698" y="246" text-anchor="middle" font-size="12">cat</text><rect x="730" y="203.12" width="36" height="26.880000000000003" fill="#888"/><text x="748" y="198.12" text-anchor="middle" font-size="11">16.8%</text><text x="748" y="246" text-anchor="middle" font-size="12">fox</text><rect x="780" y="214.32" width="36" height="15.68" fill="#888"/><text x="798" y="209.32" text-anchor="middle" font-size="11">9.8%</text><text x="798" y="246" text-anchor="middle" font-size="12">car</text><rect x="830" y="220.72" width="36" height="9.28" fill="#888"/><text x="848" y="215.72" text-anchor="middle" font-size="11">5.8%</text><text x="848" y="246" text-anchor="middle" font-size="12">moon</text><text x="450" y="275" text-anchor="middle" font-size="12" fill="#555">Low temperature: nearly always the top word. High temperature: the long tail gets real chances.</text></svg>